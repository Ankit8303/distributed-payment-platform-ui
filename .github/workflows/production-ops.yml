name: Production Operations Smoke Verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public production HTTPS URL, for example https://app.example.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-operations-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify Public Production Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Verify public production URL
        env:
          PRODUCTION_URL: ${{ inputs.base_url }}
        run: node scripts/operations/verify-production.mjs "$PRODUCTION_URL"
