name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Frontend Quality & Verification Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Verify repository hygiene
        run: pwsh ./scripts/verification/verify-repo.ps1

      - name: Verify environment configuration
        run: pwsh ./scripts/verification/verify-env.ps1

      - name: Check for committed secrets
        run: pwsh ./scripts/security/check-secrets.ps1

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Unit & Component Tests (Vitest)
        run: npm run test

      - name: Install Playwright Browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Accessibility & Invariant Tests
        run: npx playwright test tests/e2e/accessibility.spec.ts

      - name: Production Build Verification
        run: npm run build

      - name: Full Verification Script
        run: npm run verify

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  containerization:
    name: Docker Build & Smoke Verification
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: docker build -t distributed-payment-platform-ui:ci .

      - name: Run Container Smoke Verification
        run: |
          echo "Starting container in background..."
          docker run -d --name frontend-smoke -p 3000:3000 -e NEXT_PUBLIC_API_URL=http://localhost:8080 distributed-payment-platform-ui:ci
          
          echo "Waiting for container readiness..."
          READY=0
          for i in $(seq 1 20); do
            if curl -s -f http://127.0.0.1:3000/ > /dev/null; then
              echo "Container health smoke probe succeeded (HTTP 200 OK) on attempt $i."
              READY=1
              break
            fi
            sleep 1
          done
          
          if [ $READY -ne 1 ]; then
            echo "ERROR: Container failed to respond to smoke probe within 20s. Logs:"
            docker logs frontend-smoke
            exit 1
          fi

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop frontend-smoke || true
          docker rm frontend-smoke || true
