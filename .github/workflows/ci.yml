name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify repository hygiene
        run: pwsh ./scripts/verification/verify-repo.ps1

      - name: Check for secrets
        run: pwsh ./scripts/security/check-secrets.ps1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Component Tests
        run: npm run test

      - name: Production Build
        run: npm run build
