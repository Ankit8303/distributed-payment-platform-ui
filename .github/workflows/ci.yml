name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Frontend Quality & Verification Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Verify repository hygiene
        run: pwsh ./scripts/verification/verify-repo.ps1

      - name: Verify environment configuration
        run: pwsh ./scripts/verification/verify-env.ps1

      - name: Verify production deployment configuration
        run: node ./scripts/deployment/verify-production-config.mjs deploy/.env.production.example

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Gitleaks repository secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Check for committed secrets (defense in depth)
        run: pwsh ./scripts/security/check-secrets.ps1

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Unit & Component Tests (Vitest)
        run: npm run test

      - name: Install Playwright Browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Full Regression Suite
        run: npx playwright test

      - name: Production Build Verification
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
        run: npm run build

      - name: Full Verification Script
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
        run: npm run verify

      - name: Production Runtime Performance Gate
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
          PERF_REQUESTS: 200
          PERF_CONCURRENCY: 20
          PERF_MAX_P95_MS: 500
          PERF_MAX_P99_MS: 1000
          PERF_MAX_ERROR_RATE: 0
        run: npm run performance:runtime

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  containerization:
    name: Docker Build & Smoke Verification
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.test -t distributed-payment-platform-ui:ci .

      - name: Run Container Smoke Verification
        run: |
          echo "Starting container in background..."
          docker run -d --name frontend-smoke -p 3000:3000 distributed-payment-platform-ui:ci

          echo "Waiting for container healthcheck..."
          READY=0
          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' frontend-smoke 2>/dev/null || true)"
            echo "Healthcheck attempt $i: ${STATUS:-starting}"
            if [ "$STATUS" = "healthy" ]; then
              READY=1
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "ERROR: Container healthcheck reported unhealthy. Logs:"
              docker logs frontend-smoke
              exit 1
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "ERROR: Container did not become healthy within 30s. Logs:"
            docker logs frontend-smoke
            exit 1
          fi

          curl -sS -f http://127.0.0.1:3000/api/healthz > /tmp/healthz.json
          grep -q '"status":"ok"' /tmp/healthz.json
          curl -sS -f http://127.0.0.1:3000/api/readyz > /tmp/readyz.json
          grep -q '"status":"ready"' /tmp/readyz.json
          curl -sS -f http://127.0.0.1:3000/ > /dev/null
          echo "Runtime health, readiness, and landing-page smoke probes passed."

      - name: Verify Production Security Headers
        run: |
          HEADERS="$(curl -sS -D - -o /dev/null http://127.0.0.1:3000/)"
          echo "$HEADERS"

          echo "$HEADERS" | grep -qi '^strict-transport-security:' || {
            echo "ERROR: Strict-Transport-Security header missing"
            exit 1
          }

          echo "$HEADERS" | grep -qi '^x-content-type-options: nosniff' || {
            echo "ERROR: X-Content-Type-Options header missing or incorrect"
            exit 1
          }

          CSP="$(printf '%s\n' "$HEADERS" | tr -d '\r' | grep -i '^content-security-policy:' || true)"
          if [ -z "$CSP" ]; then
            echo "ERROR: Content-Security-Policy header missing"
            exit 1
          fi

          printf '%s\n' "$CSP" | grep -q "object-src 'none'" || {
            echo "ERROR: CSP object-src restriction missing"
            exit 1
          }

          if printf '%s\n' "$CSP" | grep -q "unsafe-eval"; then
            echo "ERROR: Production CSP contains unsafe-eval"
            exit 1
          fi

          if printf '%s\n' "$CSP" | grep -q "style-src 'self' 'unsafe-inline'"; then
            echo "ERROR: Production CSP permits unsafe-inline styles"
            exit 1
          fi

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop frontend-smoke || true
          docker rm frontend-smoke || true
